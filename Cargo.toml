[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/backend",
    "crates/app",
    "crates/alloc-check",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
license = "MIT"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

name: Bug
description: Something in the mixer, a cable, or a backend behaved wrong
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Cargo.toml version or the vX.Y.Z tag
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Linux (PipeWire)
        - Windows
    validations:
      required: true

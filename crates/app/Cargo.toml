[package]
name = "audio-program"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Desktop mixer with virtual audio cables"

[lib]
name = "audio_program"
path = "src/lib.rs"

[[bin]]
name = "audio-program"
path = "src/main.rs"

[dependencies]
audio-program-backend = { path = "../backend" }
audio-program-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }

[lints]
workspace = true
